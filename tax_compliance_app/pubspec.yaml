name: tax_compliance_app
description: Tax Compliance and Filing Assistance System for Tanzania
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ==================== STATE MANAGEMENT ====================
  provider: ^6.1.1

  # ==================== UI & DESIGN ====================
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.2

  # ==================== NAVIGATION ====================
  go_router: ^13.0.1

  # ==================== DATE & TIME ====================
  intl: ^0.20.2
  table_calendar: ^3.0.9
  timeago: ^3.6.0

  # ==================== STORAGE ====================
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  localstorage: ^4.0.1

  # ==================== NETWORKING ====================
  http: ^1.1.0
  dio: ^5.3.2
  retrofit: ^4.0.1
  logger: ^1.4.0
  connectivity_plus: ^5.0.1
  internet_connection_checker: ^1.0.0+1

  # ==================== EXCEL FEATURES ====================
  excel: ^2.1.0
  file_picker: ^8.3.7
  open_file: ^3.3.2
  path_provider: ^2.1.0
  share_plus: ^7.2.2
  printing: ^5.11.1
  pdf: ^3.10.4
  syncfusion_flutter_xlsio: ^28.2.11

  # ==================== PDF GENERATION ====================
  

  # ==================== CHARTS & VISUALIZATION ====================
  fl_chart: ^0.66.0
  syncfusion_flutter_charts: ^28.2.12

  # ==================== FORMS & VALIDATION ====================
  flutter_form_builder: ^10.3.0
  form_builder_validators: ^11.3.0
  flutter_otp_text_field: ^1.1.3+2

  # ==================== IMAGES & FILES ====================
  image_picker: ^1.0.4
  photo_view: ^0.14.0
  cached_network_image: ^3.3.0
  flutter_cache_manager: ^3.3.0
  file_saver: ^0.2.0

  # ==================== PERMISSIONS ====================
  permission_handler: ^11.0.1
  device_info_plus: ^9.1.0

  # ==================== NOTIFICATIONS ====================
  flutter_local_notifications: ^16.1.0

  # ==================== AUTHENTICATION ====================
  local_auth: ^2.1.6
  biometric_storage: ^5.0.1
  pin_code_fields: ^8.0.1

  # ==================== ANIMATIONS ====================
  flutter_animate: ^4.2.0
  lottie: ^2.7.0
  shimmer: ^3.0.0
  animations: ^2.0.8

  # ==================== UTILITIES ====================
  url_launcher: ^6.2.1
  package_info_plus: ^4.2.0
  device_preview: ^1.1.0
  easy_localization: ^3.0.2
  path: ^1.8.3
  universal_html: ^2.2.4
  js: ^0.6.7
  fluttertoast: ^8.2.2

  # ==================== CHAT BOT ====================
  flutter_chat_ui: ^1.6.12
  flutter_chat_types: ^3.6.1

  # ==================== QR CODE ====================
  qr_code_scanner: ^1.0.1
  qr_flutter: ^4.1.0

  # ==================== TESTING ====================
  flutter_test:
    sdk: flutter

  # ==================== DEVELOPMENT ====================
  flutter_lints: ^3.0.1

dev_dependencies:
  # For generating code
  build_runner: ^2.4.6
  retrofit_generator: ^7.0.8
  hive_generator: ^2.0.1
  json_serializable: ^6.7.1


# ==================== FLUTTER CONFIGURATION ====================
flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/splash/

# ==================== LAUNCHER ICON ====================
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#2E7D32"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  remove_alpha_ios: true

# ==================== SPLASH SCREEN ====================
flutter_native_splash:
  color: "#2E7D32"
  image: assets/splash/splash_logo.png
  android: true
  ios: true
  web: true
  android_gravity: center
  ios_content_mode: center
  web_image_mode: center
  fullscreen: true